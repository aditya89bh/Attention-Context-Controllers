name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Run smoke tests
        run: python -m pytest tests/test_smoke.py tests/test_a1_to_a6.py tests/test_full_loop.py

      - name: Run all demos
        run: python run_all_demos.py
